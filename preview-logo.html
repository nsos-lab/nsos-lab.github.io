<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NSOS Lab — Animated Logo Preview</title>
<style>
  body{margin:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  /* Preview: animated logo */
  .preview-nav{
    background:#fff;border-bottom:1px solid #e4e9f0;padding:14px 24px;
    display:flex;align-items:center;gap:10px;
  }
  .preview-logo-img{height:40px;width:auto;display:block}
  /* Also show a larger version for detail inspection */
  .preview-section{max-width:1100px;margin:40px auto;padding:0 24px}
  .preview-section h2{font-size:18px;color:#0a2540;margin-bottom:16px}
  .preview-large{height:120px;width:auto;border:1px solid #e4e9f0;border-radius:8px;background:#fff;padding:16px}
  .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
  .preview-card{background:#fff;border:1px solid #e4e9f0;border-radius:12px;padding:24px}
  .preview-card h3{font-size:15px;color:#0a2540;margin-bottom:8px}
  .preview-card p{font-size:13px;color:#4a5872;line-height:1.6}
</style>
</head>
<body>

<!-- Actual nav simulation -->
<nav class="preview-nav">
  <img class="preview-logo-img" src="assets/nsos-lab-logo-animated.gif" alt="NSOS Lab Animated" />
  <span style="font-weight:700;color:#0a2540;font-size:18px">NSOS Lab</span>
</nav>

<!-- Larger version for detail inspection -->
<div class="preview-section">
  <h2>Navigation Size (40px)</h2>
  <img class="preview-logo-img" src="assets/nsos-lab-logo-animated.gif" alt="NSOS Lab" style="border:1px solid #e4e9f0;border-radius:8px;background:#fff;padding:8px" />

  <h2 style="margin-top:32px">Detail View (120px)</h2>
  <img class="preview-large" src="assets/nsos-lab-logo-animated.gif" alt="NSOS Lab Large" />

  <div class="preview-grid">
    <div class="preview-card">
      <h3>动画元素</h3>
      <p>
        • 3层同心虚线圆环：外环慢速顺时针、中环反向、内环快速旋转<br>
        • 中心盾牌：脉冲缩放（±12%）+ 发光光晕 + 白色对勾<br>
        • 外环8个节点：缓慢轨道漂移 + 独立呼吸效果<br>
        • 右上金色点缀：高频闪烁
      </p>
    </div>
    <div class="preview-card">
      <h3>技术规格</h3>
      <p>
        • 60帧 × 20fps = 3秒循环<br>
        • 尺寸：1024×1024（显示时缩放）<br>
        • 文件大小：~2.7MB<br>
        • 格式：Animated GIF（所有浏览器兼容）<br>
        • 原图字母 N、S、S 和副标题文字完整保留
      </p>
    </div>
  </div>
</div>

</body>
</html>
